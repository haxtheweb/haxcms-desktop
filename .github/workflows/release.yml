# A version tag (vX.Y.Z, from `npm run release`) builds every platform against
# the haxcms-nodejs release in package-lock.json, signs what it has secrets
# for, and drafts a GitHub release with the installers attached. A person
# reviews the draft and publishes it. See docs/RELEASING.md.
# https://github.com/haxtheweb/issues/issues/3343
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  package:
    uses: ./.github/workflows/package.yml
    with:
      haxcms-nodejs: locked
      sign: true
    secrets:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  draft-release:
    name: draft GitHub release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # build provenance attestation of the release assets
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: haxtheweb-desktop-*
          path: artifacts
      - name: Collect release assets
        run: node scripts/collect-release-assets.js artifacts release "$GITHUB_REF_NAME"
      # the winget manifest and Homebrew cask for this version, kept on the
      # run for the first submission to each (docs/RELEASING.md)
      - name: Write package manager entries
        run: node scripts/package-manifests.js release package-managers
      - name: Upload package manager entries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-managers
          path: package-managers
          retention-days: 90
          if-no-files-found: error
      # Security: lets anyone check a download against what this run built:
      #   sha256sum -c SHA256SUMS.txt --ignore-missing
      #   gh attestation verify <file> --repo haxtheweb/haxcms-desktop
      - name: Write checksums
        run: cd release && sha256sum * > "$RUNNER_TEMP/SHA256SUMS.txt" && mv "$RUNNER_TEMP/SHA256SUMS.txt" .
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          MAC_SIGNED: ${{ secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_ID != '' }}
        run: |
          # unsigned macOS builds are blocked by Gatekeeper: not a real release yet
          if [ "$MAC_SIGNED" = "true" ]; then
            gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes --title "$GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease --generate-notes --title "$GITHUB_REF_NAME (unsigned)" \
              --notes "These builds are not code-signed. macOS will refuse to open the app and Windows will show a SmartScreen warning."
          fi
